<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facial AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 24px 18px 40px;
}

.container {
  max-width: 440px;
  margin: auto;
}

.hero-image {
  width: 100%;
  height: 390px;
  object-fit: cover;
  object-position: center 20%;
  border-radius: 18px;
  border: 1px solid #333;
}

h1 {
  font-size: 34px;
  margin: 25px 0 10px;
  letter-spacing: 2px;
}

.subtitle {
  color: #aaa;
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 28px;
}

.uploads {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 25px 0;
}

.upload {
  border: 1px solid #444;
  border-radius: 12px;
  padding: 22px 8px;
  color: #bbb;
  cursor: pointer;
  background: #111;
}

.upload span {
  display: block;
  font-size: 13px;
  margin-top: 8px;
}

.upload input { display: none; }

button {
  width: 100%;
  padding: 19px;
  border-radius: 40px;
  border: 1px solid #fff;
  background: #fff;
  color: #000;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.note {
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">

<img class="hero-image" src="hero-face.png" alt="AI facial analysis">

<h1>FACIAL AI</h1>

<div class="subtitle">
Discover Your Facial Potential.<br>
Advanced AI Facial Analysis · 12 Key Areas
</div>

<div class="uploads">

<label class="upload">
＋
<span>Front View</span>
<input type="file" accept="image/*">
</label>

<label class="upload">
＋
<span>Side Profile</span>
<input type="file" accept="image/*">
</label>

<label class="upload">
＋
<span>3/4 View</span>
<input type="file" accept="image/*">
</label>

<label class="upload">
＋
<span>Additional Photo</span>
<input type="file" accept="image/*">
</label>

</div>

<button onclick="alert('Photo upload and AI analysis will be connected in the next step.')">
START ANALYSIS →
</button>

<div class="note">
12 facial areas · Premium AI experience
</div>

</div>
</body>
</html>
