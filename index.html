
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анализ лица AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 24px 18px 40px;
}

.container {
  max-width: 440px;
  margin: auto;
}

.hero-image {
  width: 100%;
  height: 390px;
  object-fit: cover;
  object-position: center 20%;
  border-radius: 18px;
  border: 1px solid #333;
}

h1 {
  font-size: 32px;
  margin: 25px 0 10px;
  letter-spacing: 1px;
}

.subtitle {
  color: #aaa;
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 28px;
}

.uploads {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 25px 0;
}

.upload {
  border: 1px solid #444;
  border-radius: 12px;
  padding: 15px 8px;
  color: #bbb;
  cursor: pointer;
  background: #111;
  min-height: 125px;
}

.upload span {
  display: block;
  font-size: 13px;
  margin-top: 8px;
}

.upload input { display: none; }

.preview {
  display: none;
  width: 100%;
  height: 100px;
  object-fit: cover;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 19px;
  border-radius: 40px;
  border: 1px solid #fff;
  background: #fff;
  color: #000;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.note {
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">

<img class="hero-image" src="hero-face.png" alt="Сканирование лица">

<h1>АНАЛИЗ ЛИЦА AI</h1>

<div class="subtitle">
Узнай потенциал своей внешности.<br>
Профессиональный анализ по 12 зонам лица
</div>

<div class="uploads">

<label class="upload">
<img class="preview" id="preview1" alt="Предпросмотр">
＋
<span>Фото анфас</span>
<input type="file" accept="image/*" onchange="showPhoto(this, 'preview1')">
</label>

<label class="upload">
<img class="preview" id="preview2" alt="Предпросмотр">
＋
<span>Фото в профиль</span>
<input type="file" accept="image/*" onchange="showPhoto(this, 'preview2')">
</label>

<label class="upload">
<img class="preview" id="preview3" alt="Предпросмотр">
＋
<span>Фото под углом 3/4</span>
<input type="file" accept="image/*" onchange="showPhoto(this, 'preview3')">
</label>

<label class="upload">
<img class="preview" id="preview4" alt="Предпросмотр">
＋
<span>Дополнительное фото</span>
<input type="file" accept="image/*" onchange="showPhoto(this, 'preview4')">
</label>

</div>

<button onclick="startAnalysis()">
НАЧАТЬ АНАЛИЗ →
</button>

<div class="note">
12 зон лица · Персональный AI-анализ
</div>

</div>

<script>
function showPhoto(input, previewId) {
  const file = input.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('Пожалуйста, выберите изображение.');
    return;
  }

  const preview = document.getElementById(previewId);

  if (preview.dataset.url) {
    URL.revokeObjectURL(preview.dataset.url);
  }

  const url = URL.createObjectURL(file);
  preview.src = url;
  preview.dataset.url = url;
  preview.style.display = 'block';
}

function startAnalysis() {
  const files = document.querySelectorAll('input[type="file"]');
  const selected = Array.from(files).some(input => input.files.length > 0);

  if (!selected) {
    alert('Сначала загрузите фотографию.');
    return;
  }

  alert('Фотографии выбраны! Подключение настоящего AI-анализа будет следующим этапом.');
}
</script>

</body>
</html>
