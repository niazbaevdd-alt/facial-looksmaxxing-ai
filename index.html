
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анализ лица AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 24px 18px 40px;
}

.container {
  max-width: 440px;
  margin: auto;
}

.hero-image {
  width: 100%;
  height: 390px;
  object-fit: cover;
  object-position: center 20%;
  border-radius: 18px;
  border: 1px solid #333;
}

h1 {
  font-size: 32px;
  margin: 25px 0 10px;
  letter-spacing: 1px;
}

.subtitle {
  color: #aaa;
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 28px;
}

.uploads {
  margin: 25px 0;
}

.upload {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid #444;
  border-radius: 16px;
  padding: 20px;
  color: #bbb;
  cursor: pointer;
  background: #111;
  min-height: 190px;
}

.upload span {
  display: block;
  font-size: 14px;
  margin-top: 10px;
}

.upload input { display: none; }

.plus {
  font-size: 32px;
  color: #fff;
}

.preview {
  display: none;
  width: 100%;
  max-height: 260px;
  object-fit: contain;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 19px;
  border-radius: 40px;
  border: 1px solid #fff;
  background: #fff;
  color: #000;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.note {
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">

<img class="hero-image" src="hero-face.png" alt="Сканирование лица">

<h1>АНАЛИЗ ЛИЦА AI</h1>

<div class="subtitle">
Узнай потенциал своей внешности.<br>
Подробный анализ по 12 зонам лица
</div>

<div class="uploads">

<label class="upload">
<img class="preview" id="preview1" alt="Предпросмотр фотографии">
<span class="plus" id="plus1">＋</span>
<span id="uploadText">Загрузить фото анфас</span>
<input
  type="file"
  id="facePhoto"
  accept="image/jpeg,image/png,image/webp"
  onchange="showPhoto(this)"
>
</label>

</div>

<button onclick="startAnalysis()">
НАЧАТЬ АНАЛИЗ →
</button>

<div class="note">
12 зон лица · Персональный AI-анализ
</div>

</div>

<script>
let selectedPhoto = null;

function showPhoto(input) {
  const file = input.files[0];
  if (!file) return;

  const allowedTypes = [
    'image/jpeg',
    'image/png',
    'image/webp'
  ];

  if (!allowedTypes.includes(file.type)) {
    alert('Выберите фотографию в формате JPG, PNG или WEBP.');
    input.value = '';
    return;
  }

  if (file.size > 15 * 1024 * 1024) {
    alert('Размер фотографии не должен превышать 15 МБ.');
    input.value = '';
    return;
  }

  selectedPhoto = file;

  const preview = document.getElementById('preview1');

  if (preview.dataset.url) {
    URL.revokeObjectURL(preview.dataset.url);
  }

  const url = URL.createObjectURL(file);

  preview.src = url;
  preview.dataset.url = url;
  preview.style.display = 'block';

  document.getElementById('plus1').style.display = 'none';
  document.getElementById('uploadText').textContent =
    'Фото загружено · Нажмите, чтобы заменить';
}

function startAnalysis() {
  if (!selectedPhoto) {
    alert('Сначала загрузите фотографию лица.');
    return;
  }

  alert(
    'Фотография выбрана успешно!\n\n' +
    'Следующий этап — подключение настоящего AI-анализа.'
  );
}
</script>

</body>
</html>
